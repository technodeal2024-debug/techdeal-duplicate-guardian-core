[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techdeal-duplicate-guardian-core"
version = "0.1.0"
description = "Safe, read-only duplicate file detection toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "TechDeal AI contributors"}]
keywords = ["duplicates", "filesystem", "hashing", "privacy", "read-only"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
td-duplicates = "techdeal_duplicate_guardian_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
